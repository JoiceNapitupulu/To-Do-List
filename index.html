<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant To-Do List</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter and Playfair Display fonts for a clean, modern aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Pinyon+Script&display=swap" rel="stylesheet">
    <!-- Load Lucide icons for buttons and status indicators -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 sm:p-8">

    <!-- Main Application Container -->
    <div id="app-container" class="card w-full max-w-4xl bg-color-off-white rounded-3xl overflow-hidden shadow-2xl transition-all duration-300">
        <div class="flex flex-col md:flex-row min-h-[600px]">

            <!-- Left Panel (Decorative Sidebar & Navigation) -->
            <div class="bg-color-dark-berry text-white p-6 md:w-1/4 flex flex-col justify-start rounded-t-3xl md:rounded-l-3xl md:rounded-tr-none">
                <div class="text-3xl main-title mb-6 mt-6 task-flow-title">Task Flow</div>
                
                <p id="user-id-display" class="text-xs opacity-75 mb-6 truncate"></p>

                <nav class="flex flex-col space-y-3">
                    <!-- Filter Link "All Tasks" (Default) -->
                    <a id="filter-all" href="#" onclick="changeFilter('all'); return false;" class="filter-link flex items-center p-3 rounded-xl bg-color-mid-pink hover:bg-opacity-80 transition-colors">
                        <i data-lucide="list-checks" class="w-5 h-5 mr-3"></i>
                        <span>All Tasks</span>
                    </a>
                    <!-- Filter Link "Active Tasks" (Not Completed) -->
                    <a id="filter-active" href="#" onclick="changeFilter('active'); return false;" class="filter-link flex items-center p-3 rounded-xl hover:bg-white hover:text-color-dark-berry transition-colors">
                        <i data-lucide="calendar" class="w-5 h-5 mr-3"></i>
                        <span>Active Tasks</span>
                    </a>
                    <!-- Filter Link "Completed Tasks" -->
                    <a id="filter-completed" href="#" onclick="changeFilter('completed'); return false;" class="filter-link flex items-center p-3 rounded-xl hover:bg-white hover:text-color-dark-berry transition-colors">
                        <i data-lucide="archive" class="w-5 h-5 mr-3"></i>
                        <span>Completed</span>
                    </a>
                </nav>
            </div>

            <!-- Right Panel (Main To-Do List Content) -->
            <div class="p-6 md:p-10 md:w-3/4 flex flex-col">
                <h1 class="text-5xl main-title color-dark-berry mb-8">
                    <span class="pinyon-script pinyon-script-d">D</span>aily <span class="pinyon-script pinyon-script-p">P</span>lanner
                </h1>

                <!-- New Task Input Section -->
                <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 mb-8">
                    <!-- Task Input (Span 3 on small, full on mobile) -->
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="Enter your new task here..."
                        class="sm:col-span-3 p-3 rounded-xl border-2 border-color-mid-pink focus:outline-none focus:ring-0 text-color-dark-berry"
                    >
                    <!-- Deadline Input (Span 2 on small, full on mobile) -->
                    <input 
                        type="date" 
                        id="task-deadline" 
                        title="Set Deadline (Optional)"
                        class="sm:col-span-1 p-3 rounded-xl border-2 border-color-mid-pink focus:outline-none focus:ring-0 text-color-dark-berry"
                    >

                    <button 
                        id="add-task-btn"
                        onclick="addTask()"
                        class="sm:col-span-1 bg-color-dark-berry text-white p-3 rounded-xl hover:bg-color-mid-pink transition-colors flex items-center justify-center font-semibold shrink-0"
                    >
                        <i data-lucide="plus" class="w-5 h-5 sm:mr-2"></i>
                        <span class="hidden sm:inline">Add Task</span>
                    </button>
                </div>

                <!-- Task List Section -->
                <ul id="task-list" class="space-y-3 flex-grow">
                    <!-- Tasks will be added here by JavaScript -->
                    <li class="p-4 bg-color-light-pink rounded-xl text-center text-color-mid-pink font-medium">
                        <i data-lucide="loader" class="w-5 h-5 inline mr-2 animate-spin"></i>
                        Loading tasks...
                    </li>
                </ul>

                <!-- Footer / Status -->
                <div id="task-status" class="mt-8 pt-4 border-t border-gray-200 text-sm text-center color-dark-berry font-medium">
                    0 tasks completed | 0 total tasks
                </div>
            </div>
        </div>
    </div>
    
    <!-- Custom Modal Area for Confirmation/Error (managed by JS) -->
    <div id="modal-container"></div>

    <script src="script.js" type="module"></script>
</body>
</html>
